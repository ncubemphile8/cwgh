name: CWGH website checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const a=require("./audit-report.json"); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + item.severity + " — " + (item.fixAvailable ? "fix available" : "no automatic fix") + "; direct=" + item.isDirect)'
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
